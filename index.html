<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrewPilot</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#fff}
header{padding:18px;background:#1e293b;position:sticky;top:0}
nav{display:flex;gap:8px;padding:12px;background:#111827;position:sticky;top:64px}
nav button{flex:1;padding:10px;border:0;border-radius:10px;background:#334155;color:#fff}
.page{display:none;padding:16px}.active{display:block}.card{background:#1e293b;border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center}.small{color:#94a3b8;font-size:12px}
.progress{height:10px;background:#334155;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#f59e0b}
#timerBig{text-align:center;font-size:54px;font-weight:700;margin:18px 0}
.start{width:100%;padding:14px;background:#16a34a;border:0;border-radius:12px;color:#fff;font-weight:700}.reset{margin-top:8px;background:#475569}
</style></head>
<body>
<header><h2>🍺 BrewPilot</h2><div class="small">Helles · 500 L</div></header>
<nav><button onclick="show('home')">Home</button><button onclick="show('brew')">Ablauf</button><button onclick="show('timer')">Timer</button><button onclick="show('tank')">Tanks</button></nav>
<section id="home" class="page active"><div class="card"><div class="row"><b>Sud 2026-001</b><span id="pct">0%</span></div><div class="progress"><div id="bar" class="fill"></div></div><div id="done" class="small" style="margin-top:8px">0/20</div></div></section>
<section id="brew" class="page"><div class="card"><h3>Brauablauf</h3><div id="list"></div></div></section>
<section id="timer" class="page"><div class="card"><h3>Kochtimer</h3><div class="small">Manuell starten sobald die Würze kocht.</div><div id="timerBig">90:00</div><button id="start" class="start">KOCHEN STARTEN</button><button id="reset" class="start reset">Zurücksetzen</button></div><div class="card"><h3>Hopfenplan</h3><div id="events"></div></div></section>
<section id="tank" class="page"><div class="card"><h3>Tankbelegung</h3><div id="tanks"></div></div></section>
<script>
const steps=["Maische komplett ablassen","Abmaischen Uhrzeit","Braukessel ausspülen","Pumpe einstellen","Pumpe starten","5 Min Ventil offen","Läuterbeginn","Rührwerk EIN","1. NG","2. NG","3. NG","4. NG","Aufheizen","Warmwasser AUS","Weiterläutern","Reinigen","Kochbeginn","Rührwerk AUS","Hopfengaben","Tank füllen"];
const ev=[["25","Kessel öffnen"],["30","175g Magnum"],["70","Kessel öffnen"],["75","200g Tettnanger"],["80","Kessel öffnen"],["85","300g Tettnanger"],["90","Whirlpool"]];
let db=JSON.parse(localStorage.getItem("brewpilot")||"{}");if(!db.c)db.c=Array(20).fill("");if(!db.t)db.t=[0,0,0,0];
function save(){localStorage.setItem("brewpilot",JSON.stringify(db))}
function show(id){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active")}
function render(){let d=0;list.innerHTML="";steps.forEach((s,i)=>{let c=db.c[i]!="";if(c)d++;let r=document.createElement("label");r.style.display="flex";r.style.gap="10px";r.style.margin="10px 0";r.innerHTML=`<input type=checkbox ${c?"checked":""}><div><div>${s}</div><div class=small>${db.c[i]}</div></div>`;r.querySelector("input").onchange=e=>{db.c[i]=e.target.checked?new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr":"";save();render()};list.appendChild(r)});let p=Math.round(d/20*100);bar.style.width=p+"%";pct.textContent=p+"%";done.textContent=`${d}/20 Schritte`}
let left=5400,int=null;function fmt(x){let m=Math.floor(x/60),s=x%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function re(){timerBig.textContent=fmt(left);events.innerHTML="";let el=(5400-left)/60;ev.forEach(([m,t])=>{let e=document.createElement("div");e.className="row";if(el>=m)e.innerHTML=`<span style='color:#22c55e'>✓ ${t}</span>`;else e.innerHTML=`<span>${t}</span><span>${fmt(m*60-(5400-left))}</span>`;events.appendChild(e)})}
start.onclick=()=>{if(int)return;start.textContent="KOCHEN LÄUFT";start.style.background="#dc2626";int=setInterval(()=>{left--;re();let em=Math.round((5400-left)/60);ev.forEach(([m,t])=>{if(em==m&&left%60==0)alert(t)});if(left<=0){clearInterval(int);alert("Whirlpool starten!")}},1000)};reset.onclick=()=>{clearInterval(int);int=null;left=5400;start.textContent="KOCHEN STARTEN";start.style.background="#16a34a";re()};re();
function rt(){tanks.innerHTML="";db.t.forEach((v,i)=>{let r=document.createElement("label");r.className="row";r.style.margin="10px 0";r.innerHTML=`<span>Tank ${i+1} (${v?"Belegt":"Frei"})</span><input type=checkbox ${v?"checked":""}>`;r.querySelector("input").onchange=e=>{db.t[i]=e.target.checked?1:0;save();rt()};tanks.appendChild(r)})}rt();render();
</script></body></html>
